<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 880 360"
  width="880"
  height="360"
  role="img"
  aria-labelledby="title desc"
  font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
>
  <title id="title">scheduler-deadline</title>
  <desc id="desc">
    A timeline with a dueDate marker. Before the marker, isOverdue(now) returns false; after it,
    true. At the exact instant it returns false, because a deadline is overdue only when strictly in
    the past.
  </desc>

  <rect x="0" y="0" width="880" height="360" rx="16" fill="#0f172a" stroke="#1e293b" />

  <text x="44" y="58" font-size="24" font-weight="600" fill="#f1f5f9">scheduler-deadline</text>
  <text x="44" y="86" font-size="14" fill="#94a3b8">
    Models a due date and answers one question, precisely: is it overdue?
  </text>

  <!-- timeline -->
  <line x1="64" y1="200" x2="816" y2="200" stroke="#334155" stroke-width="2" />
  <line
    x1="64"
    y1="200"
    x2="512"
    y2="200"
    stroke="#34d399"
    stroke-width="4"
    stroke-linecap="round"
  />
  <line
    x1="512"
    y1="200"
    x2="816"
    y2="200"
    stroke="#fb7185"
    stroke-width="4"
    stroke-linecap="round"
  />

  <text x="816" y="180" font-size="11" fill="#64748b" text-anchor="end">time →</text>

  <!-- dueDate marker -->
  <line
    x1="512"
    y1="152"
    x2="512"
    y2="246"
    stroke="#fbbf24"
    stroke-width="2"
    stroke-dasharray="4 3"
  />
  <circle cx="512" cy="200" r="6.5" fill="#fbbf24" stroke="#0f172a" stroke-width="3" />
  <text x="512" y="142" font-size="13" font-weight="600" fill="#fbbf24" text-anchor="middle">
    dueDate
  </text>

  <!-- verdicts -->
  <text
    x="288"
    y="234"
    font-size="13"
    fill="#34d399"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
  >
    isOverdue(now) === false
  </text>
  <text
    x="664"
    y="234"
    font-size="13"
    fill="#fb7185"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
  >
    isOverdue(now) === true
  </text>

  <text x="512" y="272" font-size="12" fill="#94a3b8" text-anchor="middle">
    at the exact instant → false, because overdue means strictly in the past
  </text>

  <line x1="44" y1="300" x2="836" y2="300" stroke="#1e293b" stroke-width="1" />

  <text x="44" y="326" font-size="12.5" fill="#8b949e">
    Validated on construction • Immutable, copied in and out • Clock injectable for deterministic
    tests
  </text>
  <text x="44" y="346" font-size="12.5" fill="#64748b">
    Zero runtime dependencies • ESM and CommonJS • Node 20+
  </text>
</svg>
