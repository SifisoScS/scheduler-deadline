name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      # Actions are pinned to commit SHAs rather than mutable tags so a
      # compromised or force-moved tag cannot silently change what runs here.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Runs before install: a pruned lockfile is a property of the file itself,
      # and failing here gives a clearer message than a later ENOENT would.
      - name: Verify lockfile is not platform-pruned
        run: npm run check-lockfile

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Exercises the compiled output the way a consumer would, and asserts on
      # the results. A module that merely loads without throwing is not a test.
      # Both build formats are checked: a broken ESM emit is invisible to the
      # CommonJS test suite, so only this step would catch it.
      - name: Smoke test (CommonJS build)
        run: |
          node -e "
            const assert = require('node:assert/strict');
            const { Deadline, validate } = require('./dist/cjs/index.js');

            const deadline = new Deadline(new Date('2030-01-01'), 'ci');
            assert.equal(deadline.isOverdue(), false);
            assert.equal(deadline.getDescription(), 'ci');
            assert.equal(deadline.isOverdue(new Date('2031-01-01')), true);

            deadline.getDueDate().setFullYear(1990);
            assert.equal(deadline.isOverdue(), false, 'Deadline must be immutable');

            assert.equal(validate(0), true);
            assert.equal(validate(undefined), false);
            assert.throws(() => new Deadline(new Date('nope')));
            assert.throws(() => deadline.isOverdue(new Date('nope')));

            console.log('cjs smoke ok');
          "

      - name: Smoke test (ESM build)
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import { Deadline, validate } from './dist/esm/index.js';

            const deadline = new Deadline(new Date('2030-01-01'), 'ci');
            assert.equal(deadline.isOverdue(), false);
            assert.equal(deadline.getDescription(), 'ci');

            deadline.getDueDate().setFullYear(1990);
            assert.equal(deadline.isOverdue(), false, 'Deadline must be immutable');

            assert.equal(validate(0), true);
            assert.equal(validate(undefined), false);
            assert.throws(() => new Deadline(new Date('nope')));

            console.log('esm smoke ok');
          "

      # Resolution through the exports map is a separate failure mode from the
      # builds themselves: both can be correct while consumers still get the
      # wrong file, or nothing at all.
      - name: Verify packaged exports resolve
        run: |
          mkdir -p /tmp/pkg /tmp/consumer
          npm pack --pack-destination /tmp/pkg
          cd /tmp/consumer
          echo '{"name":"consumer","version":"1.0.0","private":true}' > package.json
          npm install /tmp/pkg/scheduler-deadline-*.tgz
          node -e "
            const assert = require('node:assert/strict');
            const { sep } = require('node:path');
            const resolved = require.resolve('scheduler-deadline').split(sep).join('/');
            assert.ok(resolved.endsWith('dist/cjs/index.js'), 'require must resolve to the CJS build, got ' + resolved);
            const { Deadline } = require('scheduler-deadline');
            assert.equal(new Deadline(new Date('2030-01-01'), 'x').getDescription(), 'x');
            console.log('require ->', resolved);
          "
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import { Deadline } from 'scheduler-deadline';
            const resolved = import.meta.resolve('scheduler-deadline');
            assert.ok(resolved.endsWith('dist/esm/index.js'), 'import must resolve to the ESM build, got ' + resolved);
            assert.equal(new Deadline(new Date('2030-01-01'), 'y').getDescription(), 'y');
            console.log('import  ->', resolved);
          "
